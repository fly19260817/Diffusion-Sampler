[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion-sampler"
version = "0.1.0"
description = "Composable diffusion pipelines with independent schedules and solvers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.9,<3",
  "diffusers>=0.35",
  "transformers>=4.57,<6",
  "accelerate>=1.10,<2",
  "safetensors>=0.6",
  "sentencepiece>=0.2",
  "protobuf>=4.25",
  "Pillow>=11",
  "scipy>=1.14",
]

[tool.setuptools.packages.find]
where = ["src"]
